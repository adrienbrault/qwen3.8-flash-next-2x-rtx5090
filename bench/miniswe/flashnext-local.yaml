# mini-SWE-agent overlay for the Flash-Next TabbyAPI seat (:8022), SWE-bench Verified.
#
# Serving plumbing only: it sets the endpoint and the model name and changes no prompt and no limit, so a score
# from this overlay is a score on the stock harness, the stock builtin benchmarks/swebench.yaml (the leaderboard's
# bash-only setting, step_limit 250) and the stock limits.
#
# Sampling: 0.6/0.95/20 reaches the server from this seat's sampler preset (qwen38_thinking), because mini-swe
# sends only max_tokens.
model:
  model_name: openai/qwen3.8-flash-next-exl3-3.05bpw
  cost_tracking: ignore_errors      # local model: litellm has no price entry and would raise
  model_kwargs:
    api_base: http://127.0.0.1:8022/v1
    api_key: local
    timeout: 1800
    max_tokens: 32768               # a runaway thinking loop releases its slot and mini-swe recovers from
                                    # finish_reason=length
    drop_params: true
    parallel_tool_calls: true
environment:
  pull_timeout: 900                 # `docker run` includes the pull; images are pre-pulled, this is the fallback
  run_args: ["--rm", "--memory=3g", "--memory-swap=3g"]
